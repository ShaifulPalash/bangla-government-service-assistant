  - id: nid-006
    title: "NID Fee Schedule"
    url: "https://services.nidw.gov.bd/nid-pub/fees"
    service: nid
    language: mixed
    doc_type: text
    capture: manual
    publisher: "Bangladesh Election Commission"
    published_date: 2015-09-01
    last_updated_date: null
    verified_date: 2026-10-15
    notes: >-
      NID fee schedule captured from an image displayed on the official NID
      fee-calculator page. The original image is stored at
      data/raw/nid/nid-006-fees.jpg. OCR output is stored at
      data/processed/nid/nid-006-fees-raw.txt, and the manually reviewed
      transcription is stored at data/processed/nid/nid-006-fees.txt.
      The notice is dated 1 September 2015. The transcription records the
      listed fees and a 15% VAT rate, with VAT calculations shown separately
      from the base fees. Confirm the current fee amounts, VAT treatment,
      processing categories, and payment instructions against the official
      NID service before relying on them for an application.

