# Official-source allow-list for the Bangla Government Service Assistant.
# Register every document before allowing it into the knowledge base.
#
# capture:
#   download = permitted automated download
#   manual   = capture the publicly visible content manually, if permitted

allowed_domains:
  - epassport.gov.bd
  - dip.gov.bd
  - ecs.gov.bd
  - nidw.gov.bd

sources:
