# Runs before every commit, so badly formatted files or leaked keys never enter the history.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0  # same version as requirements-dev.txt, so commit hooks and CI agree
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: no-api-keys
        name: block strings that look like Google or Groq API keys
        entry: '(AIza[0-9A-Za-z_-]{20,}|gsk_[0-9A-Za-z]{20,})'
        language: pygrep
        types: [text]
